name: kho_hoc_mobile
description: Tự học 111 — MVP học tập và luyện đề
publish_to: none
version: 0.2.0+19
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 16.2.5
  dio: 5.8.0+1
  unorm_dart: 0.3.1
  shared_preferences: 2.5.3
  url_launcher: 6.3.2
  image_picker: 1.2.2
  # Keep native plugins compatible with the pinned AGP/Gradle toolchain.
  image_picker_android: 0.8.13
  flutter_plugin_android_lifecycle: 2.0.28
  google_mlkit_text_recognition: 0.15.0
  google_mlkit_commons: 0.11.0
  path_provider: 2.1.5
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
  assets:
    - assets/offline/content.json
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-OFL.txt
