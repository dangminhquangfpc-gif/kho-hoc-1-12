name: Publish Windows demo package
on:
  push:
    branches: [demo/classroom-2026-10-15]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd demo-package
          sha256sum --check kho-hoc-demo-windows.zip.sha256
          gh release upload demo-classroom-2026-10-15 kho-hoc-demo-windows.zip kho-hoc-demo-windows.zip.sha256 --repo "$GITHUB_REPOSITORY"
