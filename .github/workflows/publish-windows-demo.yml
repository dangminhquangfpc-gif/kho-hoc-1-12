name: Publish Windows demo package
on:
  push:
    branches: [demo/tu-hoc-111-2026-10-15]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd demo-package
          sha256sum --check tu-hoc-111-demo-windows.zip.sha256
          gh release upload demo-tu-hoc-111-2026-10-15 tu-hoc-111-demo-windows.zip tu-hoc-111-demo-windows.zip.sha256 tu-hoc-111-android-unsigned.aab tu-hoc-111-android-unsigned.aab.sha256 --clobber --repo "$GITHUB_REPOSITORY"
