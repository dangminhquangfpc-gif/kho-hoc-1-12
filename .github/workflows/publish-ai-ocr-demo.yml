name: Publish local OCR and AI tutor Windows demo
on:
  push:
    branches: [feature/local-ocr-ai-tutor-20261015]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload OCR demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd demo-package
          sha256sum --check tu-hoc-111-demo-windows.zip.sha256
          gh release view demo-tu-hoc-111-2026-10-15-v16 --repo "$GITHUB_REPOSITORY" || gh release create demo-tu-hoc-111-2026-10-15-v16 --draft --target "$GITHUB_SHA" --title 'Tự học 111 · v16 · OCR tiếng Việt và trợ lý học tập' --notes 'Bản thử Windows local. OCR ảnh local; sửa văn bản trước khi dùng; AI mặc định tắt, cần dịch vụ được cấu hình; chưa triển khai backend Internet hoặc phát hành cửa hàng. Dừng bản cũ, sao lưu và chép nguyên thư mục state sang bản mới trước khi chạy.' --repo "$GITHUB_REPOSITORY"
          gh release upload demo-tu-hoc-111-2026-10-15-v16 tu-hoc-111-demo-windows.zip tu-hoc-111-demo-windows.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
