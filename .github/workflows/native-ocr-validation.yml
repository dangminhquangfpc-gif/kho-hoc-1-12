name: Native OCR validation
on:
  push:
    branches: [feature/native-ocr-ai-activation-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install the app compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - run: flutter pub get --enforce-lockfile
      - name: Allow the runner to use its Android emulator accelerator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recognize Vietnamese with the real bundled ML Kit model
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: apps/mobile
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            flutter test integration_test/native_ocr_test.dart --no-pub -d emulator-5554
