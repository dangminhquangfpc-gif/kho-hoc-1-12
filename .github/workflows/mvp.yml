name: MVP validation
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements.lock.txt
      - run: ruff check services/api scripts data/pipelines
      - run: PYTHONPATH=services/api pytest services/api/tests
      - run: python data/pipelines/import_cli.py data/seeds/questions.json
      - run: PYTHONPATH=services/api python data/pipelines/validate_language_seeds.py
      - run: bash scripts/test_rls.sh
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn --no-wasm-dry-run --dart-define=API_BASE_URL=/api
      - run: flutter build apk --debug
